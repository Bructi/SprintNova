<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Add Event</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-container">
        <header>
            <h1>Add New Event</h1>
            <p>Fill out the form to add a winner to the events page.</p>
        </header>
        <form id="add-event-form">
            <div class="form-group"><label for="eventName">Event Name</label><input type="text" id="eventName" required placeholder="e.g., Robo Wars"></div>
            <div class="form-group"><label for="winnerName">Winner Name</label><input type="text" id="winnerName" required placeholder="e.g., Arjun Singh"></div>
            <div class="form-group"><label for="className">Class</label><input type="text" id="className" required placeholder="e.g., BE EXTC"></div>
            <div class="form-group"><label for="eventYear">Year</label><input type="number" id="eventYear" required placeholder="e.g., 2025" min="2000"></div>
            <div class="form-group">
                <label for="fest">Fest</label>
                <select id="fest" required><option value="Spandan">Spandan</option><option value="Transmission">Transmission</option><option value="Sparx">Sparx</option></select>
            </div>
            <div class="form-group">
                <label for="medal">Medal</label>
                <select id="medal" required><option value="Gold">Gold</option><option value="Silver">Silver</option><option value="Bronze">Bronze</option></select>
            </div>
            <button type="submit">Add Event Winner</button>
        </form>
        <p id="success-message" class="hidden">✅ Event added successfully!</p>
        <a href="events.html" class="view-events-link">View Events Page &rarr;</a>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
